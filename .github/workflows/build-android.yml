name: Build Android ARM Binary

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build:
    name: Build for Android ARM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build release binary (ARM32)
        working-directory: ./rust-src
        run: |
          cargo ndk -t armv7 -o ../ --release build
          ls -la ../iptv-rust
          file ../iptv-rust

      - name: Build release binary (ARM64)
        working-directory: ./rust-src
        run: |
          cargo ndk -t arm64-v8a -o ../ --release build
          ls -la ../iptv-rust-arm64
          file ../iptv-rust-arm64

      - name: Upload ARM32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-rust-arm
          path: rust-src/iptv-rust
          retention-days: 30

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-rust-arm64
          path: rust-src/iptv-rust-arm64
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            rust-src/iptv-rust
            rust-src/iptv-rust-arm64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
