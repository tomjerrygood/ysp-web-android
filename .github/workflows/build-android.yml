name: Build Android ARM Binary

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build:
    name: Build for Android ARM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install Android NDK r26b
        run: |
          ANDROID_NDK_VERSION="r26b"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          wget -q "$NDK_URL" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "/opt/android-ndk-${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set environment variables
        run: |
          echo "CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CXX=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++" >> $GITHUB_ENV
          echo "AR=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV

      - name: Build release binary
        working-directory: ./rust-src
        run: |
          cargo build --release --target armv7-linux-androideabi
          ls -la target/armv7-linux-androideabi/release/iptv-rust
          file target/armv7-linux-androideabi/release/iptv-rust

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-rust-arm
          path: rust-src/target/armv7-linux-androideabi/release/iptv-rust
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: rust-src/target/armv7-linux-androideabi/release/iptv-rust
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
