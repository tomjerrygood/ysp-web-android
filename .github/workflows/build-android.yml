name: Build Android ARM Binary

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build:
    name: Build for Android ARM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Set up Android NDK
        run: |
          mkdir -p $HOME/android-ndk
          cd $HOME/android-ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          rm android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r26b" >> $GITHUB_ENV

      - name: Build release binary (ARM32)
        working-directory: ./rust-src
        env:
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          CC_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          AR_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CFLAGS_armv7-linux-androideabi: "--target=armv7a-linux-androideabi21 --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        run: |
          cargo build --target armv7-linux-androideabi --release
          cp target/armv7-linux-androideabi/release/iptv-rust ../iptv-rust

      - name: Build release binary (ARM64)
        working-directory: ./rust-src
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CFLAGS_aarch64-linux-android: "--target=aarch64-linux-android21 --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        run: |
          cargo build --target aarch64-linux-android --release
          cp target/aarch64-linux-android/release/iptv-rust ../iptv-rust-arm64

      - name: Verify binaries
        run: |
          ls -la iptv-rust iptv-rust-arm64
          file iptv-rust iptv-rust-arm64

      - name: Upload ARM32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-rust-arm
          path: iptv-rust
          retention-days: 30

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-rust-arm64
          path: iptv-rust-arm64
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            iptv-rust
            iptv-rust-arm64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
